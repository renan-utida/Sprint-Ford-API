# BANCO ORACLE (PROD)
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SERVIDOR (PROD) - HTTPS
server.port=8443

# FLYWAY
spring.flyway.url=${ORACLE_URL}
spring.flyway.user=${ORACLE_USER}
spring.flyway.password=${ORACLE_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true

# SSL / HTTPS
server.ssl.enabled=true
server.ssl.key-store=classpath:specradar-ssl.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=specradar